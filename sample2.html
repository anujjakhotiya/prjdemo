<!DOCTYPE html>
<html>
<head>
    <title>My Bandra Café</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fff3e0;
            text-align: center;
            padding: 50px;
        }

        .menu {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
        }

        h1 {
            color: #8d4b32;
        }

        .item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #8d4b32;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #5d2f20;
        }
    </style>
</head>

<body>

    <div class="menu">
        <h1>☕ My Café</h1>

        <div class="item">🍕 Pizza - ₹120</div>
        <div class="item">🍔 Burger - ₹80</div>
        <div class="item">🍟 Fries - ₹60</div>
        <div class="item">🥤 Cold Drink - ₹40</div>

        <button onclick="alert('Thank you for visiting! 😊')">
            Visit Us
        </button>
    </div>

</body>
</html>
